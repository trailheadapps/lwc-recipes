<template>
    <lightning-card
        title="GraphqlStateManager"
        icon-name="standard:shift_pattern"
    >
        <lightning-button
            slot="actions"
            label="Refresh"
            title="Refresh accounts"
            onclick={handleRefresh}
        ></lightning-button>
        <div class="slds-var-m-around_medium">
            <lightning-input
                type="search"
                onchange={handleKeyChange}
                class="slds-var-m-bottom_small"
                label="Search accounts by name"
            ></lightning-input>

            <template lwc:if={isLoading}>
                <lightning-spinner
                    alternative-text="Loading"
                    size="small"
                ></lightning-spinner>
            </template>

            <template for:each={accountList} for:item="account">
                <p key={account.Id}>
                    {account.Name}
                    <template lwc:if={account.Industry}
                        >&mdash; {account.Industry}</template
                    >
                </p>
            </template>

            <template lwc:if={errors}>
                <c-error-panel errors={errors}></c-error-panel>
            </template>
        </div>

        <c-view-source source="lwc/graphqlStateManager" slot="footer">
            Fetch records with the built-in
            <code>lightning/stateManagerGraphQL</code> state manager, driving
            the query imperatively with <code>setVariables</code> and
            <code>refresh</code>.
        </c-view-source>
    </lightning-card>
</template>
